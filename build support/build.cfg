# build.cfg - per-project build configuration, read by build.bat.
# Format: KEY=VALUE, one per line. A '#' at column 0 is a whole-line comment.
# Do NOT put an inline comment after a value - it becomes part of the value.
#
#   build.bat "<repo root>" release   build and release Transport
#   build.bat "<repo root>" test      build only, no git
#
# One product, so build.cfg is the only config here - which also keeps the
# Patrick Builder GUI and build_all.bat working, since both invoke build.bat
# with only the repo path.
#
# The Control Experiment and Transport Server packages were retired; their
# source stays under ..\src and ships inside the Transport package. Their
# published .vip files remain on the repository for existing users.
#
# Sweep Control is a separate nested project (..\Sweep Control) with its own
# .vipb and its own config. It depends on Transport, not the other way round,
# and is superseded by FLEX.

# A package only - no application or installer, so no APP_SPEC / INST_SPEC.
BUILD_VIP=true
BUILD_INSTALLER=false

# Run the git release step (commit/merge/tag/push + GitHub release)?
# The build number is bumped either way, before the commit, so a release commit
# carries it. With BUILD_VIP=true the bump is VIPM's, done inside vipBuild.
DO_RELEASE=true

# Named explicitly rather than relying on the single-.vipb fallback, so adding
# another .vipb here later cannot silently change what this config builds.
VIPB=Transport.vipb

# No TAG_PREFIX: one product, so bare version tags - which is what this repo's
# history already uses (2.4.1.48, 2.4.0.47, ...) and what build.bat defaults to.

# Optional overrides - uncomment to use.
# LVVER / LVBIT default to the .vipb's Package_LabVIEW_Version:
# LVVER=2019
# LVBIT=64
# PUBLISHER=Levylab
