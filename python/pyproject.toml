[project]
name = "levylab-expconfig"
version = "0.1.0"
description = "Prototype experiment configurator: wiring topology, Krohn-Hite and lock-in settings"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyzmq>=26",
    "PySide6>=6.8",
    "psycopg[binary]>=3.2",
]

[project.scripts]
expconfig = "expconfig.app:main"
expconfig-sim = "expconfig.sim:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expconfig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
